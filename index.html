const panel=document.createElement('div');panel.style.cssText='position:fixed;inset:0;z-index:9999;background:#e3ead5;display:grid;place-items:center;padding:20px';panel.innerHTML='<section style="width:min(100%,420px);text-align:center"><h2>森の旅の栞</h2><p>今日はどちらの名前で冒険する？</p><div id="cloudnames" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div><p id="cloudmsg" role="status"></p><button id="cloudoff">端末内で使う</button></section>';document.body.append(panel);
function names(){let el=$('cloudnames');el.replaceChildren();s.people.forEach((p,i)=>{let b=document.createElement('button');b.style.cssText='min-height:90px;font-size:18px';b.textContent=p.name||('名前'+(i+1));b.onclick=()=>{s.active=i;localSave();panel.style.display='none';render()};el.append(b)})}names();
const sessionKey='forest-cloud-session-v2';function persist(){try{if(auth)localStorage.setItem(sessionKey,JSON.stringify(auth));else localStorage.removeItem(sessionKey)}catch(e){}}
const controls=document.createElement('div');controls.style.cssText='display:flex;justify-content:center;gap:8px;padding:3px;background:#fff6e2';controls.innerHTML='<button id="cloudsync">同期</button><button id="cloudlogin">名前切替</button>'; $('app').insertBefore(controls,$('nav'));
async function refresh(){if(auth&&auth.expires_at*1000-Date.now()<90000){auth=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:auth.refresh_token});auth.expires_at=Math.floor(Date.now()/1000)+auth.expires_in;persist()}}
async function connect(){await refresh();let rows=await api('/rest/v1/trips?select=id,data,version&order=created_at.asc&limit=1');if(!rows.length){rows=await api('/rest/v1/trips','POST',{owner_id:auth.user.id,title:s.title||'森の小さな旅の栞',travel_date:s.date||null,data:JSON.parse(snapshot())},{Prefer:'return=representation'})}let r=rows[0];trip=r.id;version=r.version;let active=s.active;if(r.data?.people?.length===2)s={...base(),...r.data,active};baseline=snapshot();blocked=false;render();status('☁ クラウド接続済み');names();panel.style.display='grid';$('cloudlogin').textContent='名前切替'}
async function sync(){if(!auth||!trip||busy||blocked)return;busy=true;try{await refresh();let current=snapshot();if(current!==baseline){let x=JSON.parse(current);let rows=await api('/rest/v1/trips?id=eq.'+trip+'&version=eq.'+version,'PATCH',{data:x,title:x.title||'森の小さな旅の栞',travel_date:x.date||null},{Prefer:'return=representation'});if(!rows.length){blocked=true;status('⚠ 同時編集：同期停止');alert('別端末で更新されました。端末のバックアップを保存してから、再ログインしてクラウド版を読み込んでください。');return}version=rows[0].version;baseline=current;status('☁ 同期済み')}else{let rows=await api('/rest/v1/trips?id=eq.'+trip+'&select=data,version');let r=rows[0];if(r&&r.version!==version&&!$('modal').open&&!document.activeElement.matches('input,textarea,select')){let active=s.active;s={...base(),...r.data,active};version=r.version;baseline=snapshot();render()}status('☁ 同期済み')}}catch(e){status('⚠ 同期待ち・端末保存中')}finally{busy=false}}
save=function(){localSave();if(auth&&trip){clearTimeout(timer);timer=setTimeout(sync,1000)}};
$('cloudoff').onclick=()=>panel.style.display='none';$('cloudsync').onclick=()=>{if(!auth){panel.style.display='grid';$('cloudmsg').textContent='クラウド同期には初回の招待リンクが必要です。'}else sync()};$('cloudlogin').onclick=()=>{names();panel.style.display='grid'};
(async()=>{try{let h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')&&h.get('refresh_token')){auth={access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_at:Number(h.get('expires_at'))||Math.floor(Date.now()/1000)+Number(h.get('expires_in')||3600)};history.replaceState(null,'',location.pathname+location.search);auth.user=await api('/auth/v1/user');persist()}else{auth=JSON.parse(localStorage.getItem(sessionKey)||'null')}if(auth){await connect();persist();$('cloudmsg').textContent='クラウド接続済み'}else $('cloudmsg').textContent='初回の招待リンク未認証・端末内保存'}catch(e){auth=null;trip=null;persist();$('cloudmsg').textContent='認証できません。新しい招待リンクを開いてください。'}})();
setInterval(sync,12000);
})();

</script></html>
